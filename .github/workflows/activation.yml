name: Activation

on:
  workflow_dispatch:

jobs:
  activation:
    name: Request the Unity license file
    runs-on: ubuntu-latest
    steps:
      - name: Request the manual activation file
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/workspace" -w /workspace unityci/editor:ubuntu-6000.0.23f1-base-3.2.2 /opt/unity/Editor/Unity -batchmode -quit -createManualActivationFile -logFile - || true
          ls -la
          ls -la *.alf
      - name: Upload the activation file
        uses: actions/upload-artifact@v4
        with:
          name: Manual Activation File
          path: "*.alf"
