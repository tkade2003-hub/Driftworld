name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-webgl:
    name: Build WebGL and publish to Pages
    runs-on: ubuntu-latest
    steps:
      - name: Check out the project
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache the Unity library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-WebGL-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-WebGL-

      - name: Build for WebGL
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: WebGL
          buildMethod: Driftworld.EditorTools.BuildSetup.BuildWebGL
          buildsPath: builds

      - name: Publish the WebGL build to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: builds/WebGL/WebGL

  build-ios:
    name: Build iOS (milestone lane, manual)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Check out the project
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache the Unity library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-iOS-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-iOS-

      - name: Build the Xcode project for iOS
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: iOS
          buildMethod: Driftworld.EditorTools.BuildSetup.BuildIOS
          buildsPath: builds

      - name: Upload the Xcode project as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-xcode-project
          path: builds/iOS
